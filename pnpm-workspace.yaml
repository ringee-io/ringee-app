packages:
  - packages/**
  - apps/**
  - "!apps/browser-extension/files/**"

allowBuilds:
  '@clerk/shared': set this to true or false
  '@firebase/util': set this to true or false
  '@nestjs/core': set this to true or false
  '@parcel/watcher': set this to true or false
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  '@sentry/cli': set this to true or false
  '@swc/core': set this to true or false
  '@tailwindcss/oxide': set this to true or false
  bcrypt: set this to true or false
  browser-tabs-lock: set this to true or false
  bufferutil: set this to true or false
  core-js: set this to true or false
  esbuild: set this to true or false
  keytar: set this to true or false
  prisma: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
  utf-8-validate: set this to true or false

ignoredBuiltDependencies:
  - keytar

overrides:
  "@types/react": 19.0.1
  "@types/react-dom": 19.0.2

strictPeerDependencies: false
