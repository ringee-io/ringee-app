name: ringee-stack

services:
  ringee-postgres:
    image: postgres:17-alpine
    container_name: ringee-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ringee-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ringee-password}
      POSTGRES_DB: ${POSTGRES_DB:-ringee-db-local}
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - ringee_pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ringee-user} -d ${POSTGRES_DB:-ringee-db-local} -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - ringee-network

  ringee-redis:
    image: redis:7.4-alpine
    container_name: ringee-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ringee_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ringee-network

  # Temporal server (durable background jobs). auto-setup creates the
  # `temporal` and `temporal_visibility` databases on the shared Postgres.
  ringee-temporal:
    image: temporalio/auto-setup:1.25
    container_name: ringee-temporal
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: ringee-postgres
      POSTGRES_USER: ${POSTGRES_USER:-ringee-user}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-ringee-password}
    depends_on:
      ringee-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - ringee-network

  # Opt-in only: the UI is a debugging convenience, not a runtime dependency.
  # It does NOT start with `docker-compose up -d`; bring it up on demand with
  # `docker-compose --profile debug up -d ringee-temporal-ui`. Keeping it off by
  # default avoids paying for an always-on container on self-hosted deploys.
  ringee-temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: ringee-temporal-ui
    profiles: ["debug"]
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    environment:
      TEMPORAL_ADDRESS: ringee-temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    depends_on:
      - ringee-temporal
    restart: unless-stopped
    networks:
      - ringee-network

volumes:
  ringee_pg_data:
  ringee_redis_data:

networks:
  ringee-network:
    driver: bridge
