<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ringee Dialer SDK — UI Playground</title>
    <style>
      :root {
        --bg: #eef1f5; --panel: #f7f8fa; --ink: #0f172a; --muted: #64748b;
        --line: #e2e6ec; --card: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color-scheme: light;
      }
      :root[data-demo-theme="dark"] {
        --bg: #0b1120; --panel: #0f172a; --ink: #e2e8f0; --muted: #94a3b8;
        --line: #1e293b; --card: #0b1324; color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      .hd { padding: 40px 28px 8px; max-width: 1180px; margin: 0 auto; position: relative; }
      .hd h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
      .hd .sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
      .themebtn {
        position: absolute; top: 40px; right: 28px; border: 1px solid var(--line);
        background: var(--card); color: var(--ink); border-radius: 10px;
        padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer;
      }
      section { max-width: 1180px; margin: 0 auto; padding: 20px 28px 8px; }
      section h2 {
        font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
        color: var(--muted); margin: 24px 0 14px; font-weight: 700;
      }
      .grid {
        display: grid; gap: 18px;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
      .tile {
        margin: 0; background: var(--panel); border: 1px solid var(--line);
        border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
      }
      .stage {
        display: flex; align-items: center; justify-content: center;
        min-height: 200px; padding: 8px;
        background:
          radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 8%, transparent) 1px, transparent 0)
          0 0 / 16px 16px;
        border-radius: 14px;
      }
      .stage--panel { align-items: flex-start; overflow: auto; }
      .stage--launcher { min-height: 140px; }
      .cap { display: flex; flex-direction: column; gap: 2px; }
      .cap b { font-size: 14px; }
      .cap .note { font-size: 12.5px; color: var(--muted); }
      .barframe { margin: 0 auto; }
      .live { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
      .hint { color: var(--muted); font-size: 13px; margin: 0; }
      footer { max-width: 1180px; margin: 0 auto; padding: 20px 28px 60px; color: var(--muted); font-size: 12.5px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <footer>
      States rendered with a simulated dialer (no network or WebRTC). The same
      components and styles are used in production through
      <code>Ringee.createFloating()</code> and <code>Ringee.createBar()</code>.
    </footer>
    <script src="./gallery.js"></script>
  </body>
</html>
